<script type="text/javascript">
    var lightboxes = document.querySelectorAll('.photo');
    var scrollHeight = 0;
    function toggleLightbox() {
        event.preventDefault();
        var box = event.srcElement;
        console.log(box);
        if(!box.parentElement.classList.contains("lightbox")) {
            scrollHeight = document.querySelector('html').scrollTop;
            document.querySelector('html').scrollTop = 0;
            console.log(scrollHeight);
        }
        box.parentElement.classList.toggle("lightbox");
        if(!box.parentElement.classList.contains("lightbox")) {
            document.querySelector('html').scrollTop = scrollHeight;
        }
    }
    lightboxes.forEach(lightbox => {
        lightbox.addEventListener("click", toggleLightbox)
        lightbox.setAttribute("draggable", false)
    })
    function noRightClick(event) {
        event.preventDefault();
        return false;
    }
    var photos = document.querySelectorAll('.photo');
    photos.forEach(photo => {
        photo.addEventListener("contextmenu", noRightClick);
    });
</script>
